name: Claude

# Claude Code on GitHub: responds to @claude mentions on issues/PRs, and picks
# up issues when a maintainer adds the `agent-ready` label. It works on a
# `claude/*` branch and opens a PR against `develop`. It never deploys; a
# human reviews and merges every PR (branch protection + CODEOWNERS).
#
# Action docs: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
# Pinned to v1.0.235 by commit SHA; bump deliberately.
#
# Requires: the Claude GitHub App installed on this repo, and the
# ANTHROPIC_API_KEY repository secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only react to people with a write-level association. The
    # action re-checks write permission itself; this just avoids spinning up
    # runners for drive-by mentions.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && github.event.label.name == 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Not a repo permission: lets the action mint the OIDC token it trades
      # for the Claude GitHub App token. Without it the action falls back to
      # GITHUB_TOKEN, whose PRs don't trigger pr-checks (so they could never
      # satisfy branch protection).
      id-token: write
    # Same services as the `test` job so Claude can run the suite before
    # opening a PR.
    services:
      postgres:
        image: pgvector/pgvector:pg14
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botbuilder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/botbuilder_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SIM_REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: test-secret-key-for-ci
      ENCRYPTION_KEY: TwG3wHb7SKizcVoU0bi3V7x3ODONyZCgdJr8jPK44L0=
      OPENAI_API_KEY: sk-test-ci-placeholder
      ENVIRONMENT: test
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.15.4

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          label_trigger: agent-ready
          base_branch: develop
          branch_prefix: claude/
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(pytest:*),Bash(python -m pytest:*),Bash(ruff check:*),Bash(ruff format:*),Bash(alembic heads),Bash(alembic history:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "You are working in the ZenBotZ repository. Read the 'Agent workflow' section of CLAUDE.md before changing anything, and follow it. Hard rules: (1) Work on a claude/* branch and open the pull request against develop. Never push to, merge into, or open a PR against main, and never push directly to develop. (2) Never deploy, and never edit .github/workflows/deploy-*.yml, .github/workflows/terraform.yml or anything under infra/ unless the issue explicitly asks for it. (3) Never add, print or rotate secrets; new config is an env var documented in .env.example and off when unset. (4) For bug fixes, write a failing test first. Before opening the PR run: ruff check app/ tests/; ruff format --check app/ tests/; pytest tests/ --ignore=tests/integration --ignore=tests/simulation. Report the results in the PR description, including anything you could not verify. (5) Respect the invariants in CLAUDE.md: broadcast after session.commit(), no session.refresh(attribute_names=...) in async code, every tenant query scoped by bot_id, phone numbers masked in logs, LLM output sanitized. (6) If the issue is ambiguous, needs a secret, an AWS change or a product decision, ask in a comment instead of guessing."
