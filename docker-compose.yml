version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botbuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init-vector.sql
    restart: unless-stopped

  # Serviço de Cache e Fila
  redis:
    image: redis:alpine
    container_name: zenbots_redis
    ports:
      - "6379:6379"
    # Garante persistência (AOF) para não perder a fila se reiniciar
    command: redis-server --appendonly yes 
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1h
    restart: unless-stopped

  # API (Produtor de mensagens)
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - ollama
    env_file:
      - .env
    environment:
      # URL para o Rate Limiter (Banco 0)
      - REDIS_URL=redis://redis:6379/0 
      # Host para a Fila ARQ (Banco 1 configurado no código python)
      - REDIS_HOST=redis
    restart: unless-stopped

  # ▼▼▼ NOVO SERVIÇO: WORKER (Consumidor de mensagens) ▼▼▼
  worker:
    build: .
    # Comando para iniciar o processamento da fila
    # --watch /code faz ele reiniciar se você alterar o código (ótimo para dev)
    command: arq app.worker.WorkerSettings --watch /code
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - ollama
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Precisa das mesmas configs do backend para acessar Banco e Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
    restart: unless-stopped
  # ▲▲▲ FIM DO NOVO SERVIÇO ▲▲▲

volumes:
  db_data:
  ollama_data:
  redis_data: