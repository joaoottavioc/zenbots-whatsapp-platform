version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botbuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init-vector.sql
    restart: unless-stopped

  # Serviço de Cache e Fila
  redis:
    image: redis:alpine
    container_name: zenbots_redis
    ports:
      - "6379:6379"
    # Garante persistência (AOF) para não perder a fila se reiniciar
    command: redis-server --appendonly yes 
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1h
    restart: unless-stopped

  # ▼▼▼ NOVO SERVIÇO: MAILHOG (Simulador de Email) ▼▼▼
  mailhog:
    image: mailhog/mailhog
    container_name: zenbots_mailhog
    ports:
      - "1025:1025" # Porta SMTP (Uso interno do Python)
      - "8025:8025" # Interface Web (Você acessa no navegador)
    restart: unless-stopped
  # ▲▲▲ FIM MAILHOG ▲▲▲

  # API (Produtor de mensagens)
  backend:
    build:
      context: .
      target: backend
    # Phase 1A (Phase 1A.OOM): exclude non-source directories from the
    # uvicorn --reload file watcher. The previous QA Run 3 was corrupted
    # by `WatchfilesRustInternalError: Cannot allocate memory` — uvicorn's
    # rust-based watcher had run out of inotify slots / RAM trying to
    # watch the corpus image dirs (~100+ JSON extractions, hundreds of
    # PNG images) and pycache trees that don't matter for hot-reload.
    # Excluding them lets pytest subprocesses run inside the same
    # container without competing for memory with the watcher.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-exclude '*.pyc'
      --reload-exclude '__pycache__'
      --reload-exclude '.git'
      --reload-exclude '.ruff_cache'
      --reload-exclude '.pytest_cache'
      --reload-exclude '.claude'
      --reload-exclude 'tests/simulation/corpus/extractions'
      --reload-exclude 'tests/simulation/corpus/images'
      --reload-exclude 'tests/simulation/corpus/rejected'
      --reload-exclude 'node_modules'
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - ollama
      - mailhog # Garante que o MailHog subiu
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # URL para o Rate Limiter (Banco 0)
      - REDIS_URL=redis://redis:6379/0
      # Host para a Fila ARQ (Banco 1 configurado no código python)
      - REDIS_HOST=redis
      # 2026-04-09: HF cache is at /home/appuser/.cache/huggingface so the
      # appuser runtime can read what gets downloaded. Pre-warm at startup
      # caches the model in memory for the container's lifetime; subsequent
      # find_relevant_products calls hit the in-memory model with no
      # network IO. (The previous Dockerfile pre-warm cached as root and
      # appuser couldn't see it — leaving lazy-load runtime to hit HF Hub
      # and crash on 429 rate limits.)
      - HF_HOME=/home/appuser/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/appuser/.cache/huggingface
    restart: unless-stopped

  # WORKER (Consumidor de mensagens)
  worker:
    build:
      context: .
      target: worker
    # Comando para iniciar o processamento da fila
    # --watch /code faz ele reiniciar se você alterar o código
    command: arq app.worker.WorkerSettings --watch /code
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - ollama
      - mailhog
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Precisa das mesmas configs do backend para acessar Banco e Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      # Same HF cache config as backend — worker uses find_relevant_products
      # via the embedding service. Cache lives in appuser's home so the
      # runtime user can read what gets downloaded by the lazy-load.
      - HF_HOME=/home/appuser/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/appuser/.cache/huggingface
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  redis_data: