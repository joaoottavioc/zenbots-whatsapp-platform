version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botbuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init-vector.sql
    restart: unless-stopped

  # ▼▼▼ NOVO SERVIÇO: REDIS ▼▼▼
  redis:
    image: redis:alpine
    container_name: zenbots_redis
    ports:
      - "6379:6379"
    # Garante persistência (não perde dados se reiniciar o container)
    command: redis-server --appendonly yes 
    volumes:
      - redis_data:/data
    restart: unless-stopped
  # ▲▲▲ FIM DO NOVO SERVIÇO ▲▲▲

  ollama:
    image: ollama/ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1h
    restart: unless-stopped

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - db
      - ollama
      - redis # <--- Adicionado para garantir a ordem de boot
    env_file:
      - .env
    environment:
      # URL interna do Docker para o Redis
      - REDIS_URL=redis://redis:6379/0 
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  redis_data: # <--- Novo volume para persistência do Redis